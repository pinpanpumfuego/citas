name: citas
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: citas
      POSTGRES_DB: citas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citas -d citas"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
  app:
    image: citas-app:local
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://citas:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/citas
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
    ports:
      - "127.0.0.1:3107:3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/data').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  notifications:
    image: citas-app:local
    restart: unless-stopped
    command: ["node", "scripts/notification-worker.mjs"]
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
  waha:
    image: devlikeapro/waha:latest-2026.9.2@sha256:280bdc8f860267a2488a45d00ec88529646f7468c0bf0283c595d6efdd1b5e3b
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: 'false'
      WHATSAPP_SWAGGER_ENABLED: 'false'
      WAHA_PRINT_QR: 'false'
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_RESTART_ALL_SESSIONS: 'true'
    volumes:
      - whatsapp_sessions:/app/.sessions
    mem_limit: 2g
    shm_size: 512m
volumes:
  whatsapp_sessions:
  postgres_data:
