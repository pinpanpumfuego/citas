server {
    listen 80;
    server_name laprincesadelascejas.com www.laprincesadelascejas.com;
    location /.well-known/acme-challenge/ { root /var/www/citas-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name laprincesadelascejas.com www.laprincesadelascejas.com;
    ssl_certificate /etc/letsencrypt/live/laprincesadelascejas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laprincesadelascejas.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
